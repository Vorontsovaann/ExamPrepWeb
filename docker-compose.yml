version: '3.8'
services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examprep_web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/app.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
volumes:
  sqlite_data: